services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gotrid
      POSTGRES_PASSWORD: gotrid
      POSTGRES_DB: gotrid
    ports:
      - "5432:5432"
    volumes:
      - gotrid_postgres_data:/var/lib/postgresql/data

volumes:
  gotrid_postgres_data:
